name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Show available simulators
      run: xcrun simctl list devicetypes
    
    - name: Resolve Package Dependencies
      run: swift package resolve
    
    - name: Build for iOS Simulator
      run: |
        xcodebuild -scheme FoodCalorieApp \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
          -derivedDataPath DerivedData \
          build
    
    - name: Archive App (Release Build)
      run: |
        xcodebuild archive \
          -scheme FoodCalorieApp \
          -archivePath FoodCalorieApp.xcarchive \
          -destination 'generic/platform=iOS'
    
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: FoodCalorieApp-Build
        path: |
          FoodCalorieApp.xcarchive
          DerivedData/Build/Products/Debug-iphonesimulator/