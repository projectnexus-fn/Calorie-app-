workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 120
    environment:
      ios_signing:
        distribution_type: development
        bundle_identifier: com.foodcalorieapp.ios
      vars:
        XCODE_WORKSPACE: "Package.swift"
        XCODE_SCHEME: "FoodCalorieApp"
        BUNDLE_ID: "com.foodcalorieapp.ios"
      xcode: 15.0
      cocoapods: default
    scripts:
      - name: Set up keychain to be used for code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          # For development builds, you might not need this step
          echo "Using development signing"
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          swift package resolve
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: false
