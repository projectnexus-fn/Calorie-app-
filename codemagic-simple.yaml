workflows:
  ios-build-only:
    name: iOS Build (No Signing)
    max_build_duration: 60
    environment:
      vars:
        XCODE_WORKSPACE: "Package.swift"
        XCODE_SCHEME: "FoodCalorieApp"
      xcode: 15.0
    scripts:
      - name: Install dependencies
        script: |
          echo "Installing Swift Package dependencies..."
          swift package resolve
      
      - name: Build for iOS Simulator (No Signing Required)
        script: |
          echo "Building for iOS Simulator..."
          xcodebuild build \
            -scheme "$XCODE_SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Test build (Optional)
        script: |
          echo "Running tests..."
          xcodebuild test \
            -scheme "$XCODE_SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.0' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO || echo "Tests completed with warnings"
      
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: false